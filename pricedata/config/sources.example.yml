# pricedata 来源配置示例
# 复制为 sources.yml 后按需修改；不要把登录态/cookie 写进来。

dataset_start: "2020-01-01"
min_recommend_year: 2020
currency: CNY

sources:
  - id: colorful_store
    name: 七彩虹商城
    url: https://www.skycolorful.com/
    type: official
    enabled: true
    min_interval_s: 3600
    adapter: colorful_store
    notes: "GPU / 主板页面价；低频；人工复核异常"

  - id: asus_store
    name: 华硕商城
    url: https://store.asus.com.cn/store/
    type: official
    enabled: false          # 先手动验证页面结构再打开
    min_interval_s: 3600
    adapter: asus_store
    notes: "JS 渲染，优先找 JSON 接口；不要高频抓"

  - id: manual_csv
    name: 人工价格表
    url: local
    type: manual
    enabled: true
    adapter: manual_csv
    notes: "京东/淘宝/线下人工快照；字段见 README §4"

  - id: wayback
    name: Wayback Machine
    url: https://web.archive.org/
    type: wayback
    enabled: true
    min_interval_s: 1
    adapter: wayback
    notes: "只回填历史；限速 1 req/s；尊重 robots"

  - id: lenovo_store
    name: 联想商城
    url: https://shop.lenovo.com.cn/
    type: official
    enabled: false          # 整机/笔记本，默认不进 DIY 配件目录
    adapter: lenovo_store
    notes: "如做整机，单列 prebuilts，不参与兼容性；先读 ToS"
