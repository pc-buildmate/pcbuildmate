name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed arm64 APK + draft release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK 37
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode the defense keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/defense.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/signing/defense.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > keystore.properties
          test -s keystore.properties

      - name: Build the signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain --stacktrace

      - name: Verify signature, permissions and ABI
        run: |
          BT="$ANDROID_HOME/build-tools/37.0.0"
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$BT/apksigner" verify --print-certs "$APK"
          if "$BT/aapt" dump permissions "$APK" | grep -q "android.permission.INTERNET"; then
            echo "::error title=permissions::release APK requests INTERNET"
            exit 1
          fi
          "$BT/aapt" dump badging "$APK" | grep -q "native-code: 'arm64-v8a'"
          if "$BT/aapt" dump badging "$APK" | grep "native-code" | grep -qv "arm64-v8a"; then
            echo "::error title=abi::release APK contains non-arm64 ABIs"
            exit 1
          fi

      - name: Package and checksum
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/PC-Buildmate-${TAG}.apk"
          (cd dist && sha256sum "PC-Buildmate-${TAG}.apk" > "PC-Buildmate-${TAG}.apk.sha256")
          cat "dist/PC-Buildmate-${TAG}.apk.sha256"

      - name: Create a draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --draft \
            --title "PC Buildmate ${TAG}" \
            --notes-file docs/defense/RELEASE_NOTES.md \
            "dist/PC-Buildmate-${TAG}.apk" \
            "dist/PC-Buildmate-${TAG}.apk.sha256"
          gh release view "$TAG" --json tagName,isDraft,assets --jq '"\(.tagName) draft=\(.isDraft)", (.assets[]?|"\(.name) \(.size)")'
