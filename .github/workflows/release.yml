name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed arm64 APK + draft release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK 37
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode the defense keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/defense.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/signing/defense.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > keystore.properties
          test -s keystore.properties

      - name: Build the signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain --stacktrace

      - name: Package and checksum
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/PC-Buildmate-${TAG}.apk"
          (cd dist && sha256sum "PC-Buildmate-${TAG}.apk" > "PC-Buildmate-${TAG}.apk.sha256")
          cat "dist/PC-Buildmate-${TAG}.apk.sha256"

      - name: Verify the artifact (permissions, signature, ABI, package, version)
        env:
          REQUIRE_ARM64_ONLY: "1"
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # 预发布允许 -rcN 后缀差异：v1.0.0-defense-rc2 对应 versionName 1.0.0-defense；
          # 正式 tag 必须与 versionName 完全相同（决策见 issue #105）。
          if printf '%s' "$VERSION" | grep -qE -- '-rc[0-9]+$'; then
            EXPECTED_VERSION="${VERSION%-rc*}"
          else
            EXPECTED_VERSION="$VERSION"
          fi
          echo "tag=$TAG expected versionName=$EXPECTED_VERSION"
          bash qa/verify-release.sh "dist/PC-Buildmate-${TAG}.apk" "dist/PC-Buildmate-${TAG}.apk.sha256" "$EXPECTED_VERSION"

      - name: Create a draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --draft \
            --title "PC Buildmate ${TAG}" \
            --notes-file docs/defense/RELEASE_NOTES.md \
            "dist/PC-Buildmate-${TAG}.apk" \
            "dist/PC-Buildmate-${TAG}.apk.sha256"
          gh release view "$TAG" --json tagName,isDraft,assets --jq '"\(.tagName) draft=\(.isDraft)", (.assets[]?|"\(.name) \(.size)")'
