name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs / boundaries / keywords / demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Document and scope checks
        run: |
          node tools/check-docs.mjs
          node ci/check-boundaries.mjs
          node ci/check-keywords.mjs
          node ci/check-test-tasks.mjs
      - name: Prototype regression
        run: |
          node tools/test-demo-engine.mjs
          node tools/test-demo-flow.mjs
          node tools/test-demo-ui.mjs

      - name: Price data tests
        run: |
          PYTHONPATH=pricedata/src python3 -m unittest discover -s pricedata/tests
          PYTHONPATH=pricedata/src python3 -m pricepipe.cli validate --seed pricedata/seeds/2026-11.csv

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK 37
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pcbuildmate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  jvm:
    name: JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install SDK 37
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Contracts + rule engine + Android library units
        run: |
          set -o pipefail
          ./gradlew :domain:rules:test :domain:revision:test :domain:recommend:test :domain:replacement:test :domain:state:test :domain:compare:test :data:testDebugUnitTest :feature:testDebugUnitTest :ui:testDebugUnitTest :app:testDebugUnitTest :test-oracle:test --no-daemon --console=plain --stacktrace 2>&1 | tee /tmp/gradle.log
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -40 /tmp/gradle.log
            msg=$(tail -n 8 /tmp/gradle.log | tr '\n' ' ' | cut -c1-900)
            echo "::error title=gradle::$msg"
          fi
          exit "$status"
      - name: Verification matrix (real test output)
        run: |
          node tools/gen-matrix.mjs
          node tools/check-matrix.mjs


  room:
    name: Room on emulator (instrumented)
    # PR 上不跑：要下载系统镜像、启动模拟器，约 10 分钟；只守 main 与手动触发。
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK, emulator image and create the AVD
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          AVDMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name avdmanager -type f | head -1)
          test -n "$SDKMANAGER" && test -n "$AVDMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" "emulator" "system-images;android-33;google_apis;x86_64"
          echo "no" | "$AVDMANAGER" create avd -n ci -k "system-images;android-33;google_apis;x86_64" --device pixel_5 --force
      - name: Boot the emulator
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          EMU_LOG="$RUNNER_TEMP/emulator.log"
          "$ANDROID_HOME/emulator/emulator" -accel-check || true
          "$ANDROID_HOME/emulator/emulator" -avd ci -no-window -no-audio -no-boot-anim             -no-snapshot -gpu swiftshader_indirect >"$EMU_LOG" 2>&1 &
          EMU_PID=$!
          if ! timeout 180 "$ADB" wait-for-device; then
            echo "::error title=emulator::adb 在 3 分钟内没看到设备"
            tail -40 "$EMU_LOG"
            exit 1
          fi
          for i in $(seq 1 96); do
            if "$ADB" shell getprop sys.boot_completed 2>/dev/null | grep -q 1; then
              echo "emulator booted after $((i * 5))s"
              exit 0
            fi
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "::error title=emulator::模拟器进程已退出"
              tail -40 "$EMU_LOG"
              exit 1
            fi
            sleep 5
          done
          echo "::error title=emulator::8 分钟内未完成启动"
          tail -40 "$EMU_LOG"
          exit 1
      - name: Room store contracts on device
        run: ./gradlew :data:connectedDebugAndroidTest --no-daemon --console=plain --stacktrace
      - name: Smoke-install the APK and start the app
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          ./gradlew :app:assembleDebug --no-daemon --console=plain
          "$ADB" install -r app/build/outputs/apk/debug/app-debug.apk
          "$ADB" shell monkey -p io.github.pcbuildmate -c android.intent.category.LAUNCHER 1 >/dev/null
          sleep 8
          PID=$("$ADB" shell pidof io.github.pcbuildmate)
          echo "app pid: $PID"
          if [ -z "$PID" ]; then
            "$ADB" logcat -d -t 200
            echo "::error title=launch::应用启动后进程不存在（崩溃？）"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-instrumented-results
          path: data/build/outputs/androidTest-results
          if-no-files-found: warn

  mutations:
    name: Key mutations (MUT-01..12)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: jvm
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install SDK 37
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply mutations, run target tests, restore sources
        run: node tools/run-mutations.mjs
      - name: Require 12/12 KILLED
        run: node tools/check-matrix.mjs --mutations
      - name: Verify the harness restored every source file
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: key-mutations
          path: build/reports/key-mutations.json
          if-no-files-found: warn
