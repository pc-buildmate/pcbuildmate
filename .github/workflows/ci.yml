name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs / boundaries / keywords / demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Document and scope checks
        run: |
          node tools/check-docs.mjs
          node ci/check-boundaries.mjs
          node ci/check-keywords.mjs
          node tools/check-matrix.mjs
      - name: Prototype regression
        run: |
          node tools/test-demo-engine.mjs
          node tools/test-demo-flow.mjs
          node tools/test-demo-ui.mjs

      - name: Price data tests
        run: |
          PYTHONPATH=pricedata/src python3 -m unittest discover -s pricedata/tests
          PYTHONPATH=pricedata/src python3 -m pricepipe.cli validate --seed pricedata/seeds/2026-11.csv

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK 37
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pcbuildmate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  jvm:
    name: JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Contracts + rule engine
        run: |
          set -o pipefail
          ./gradlew :contracts:test :domain:rules:test :domain:revision:test :domain:recommend:test :domain:replacement:test :domain:state:test :domain:compare:test --no-daemon --console=plain --stacktrace 2>&1 | tee /tmp/gradle.log
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -40 /tmp/gradle.log
            msg=$(tail -n 8 /tmp/gradle.log | tr '\n' ' ' | cut -c1-900)
            echo "::error title=gradle::$msg"
          fi
          exit "$status"

